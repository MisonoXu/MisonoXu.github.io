name: Deploy site
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build website
        env:
          JEKYLL_ENV: production
          SITE_OWNER: ${{ github.repository_owner }}
          SITE_REPOSITORY: ${{ github.event.repository.name }}
        run: |
          ruby -ryaml -e 'name = ENV.fetch("SITE_REPOSITORY"); owner = ENV.fetch("SITE_OWNER").downcase; abort "Use the username.github.io repository" unless name.downcase == "#{owner}.github.io"; File.write("/tmp/pages-url.yml", {"url" => "https://#{owner}.github.io", "baseurl" => ""}.to_yaml)'
          bundle exec al-folio upgrade audit --no-fail
          bundle exec jekyll build --config _config.yml,/tmp/pages-url.yml
          test -f _site/index.html
          test -f _site/assets/pdf/Jing-Zhe_Xu_CV.pdf
          touch _site/.nojekyll
      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
